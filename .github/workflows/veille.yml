# La veille : chaque jour, GitHub lance l'extraction France Travail sur ses machines,
# met à jour data/ et le résumé de la page, et enregistre le tout par un commit.
# Les identifiants sont dans Settings -> Secrets and variables -> Actions (FT_CLIENT_ID, FT_CLIENT_SECRET).
name: veille

on:
  schedule:
    - cron: "0 5 * * *"       # demandé à 5 h UTC ; GitHub retarde les tâches programmées, elles partent en pratique vers midi
  workflow_dispatch:          # et le bouton « Run workflow » pour lancer à la main

permissions:
  contents: write             # le workflow doit pouvoir pousser son commit

jobs:
  extraire:
    runs-on: ubuntu-24.04     # version fixée : ubuntu-latest change de version sans prévenir
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Extraire les offres et refaire le résumé
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
        run: |
          # l'API France Travail flanche parfois quelques minutes : trois essais, dix minutes d'écart
          ok=0
          for essai in 1 2 3; do
            if python scripts/extraire.py; then ok=1; break; fi
            echo "Extraction en échec (essai $essai sur 3)"
            if [ "$essai" -lt 3 ]; then sleep 600; fi
          done
          [ "$ok" = 1 ]
          python scripts/resumer.py

      - name: Enregistrer la donnée du jour (commit + push)
        run: |
          git config user.name "veille-bot"
          git config user.email "actions@github.com"
          git add data
          git commit -m "veille : offres du $(date -u +%Y-%m-%d)" || echo "rien de nouveau"
          git push
